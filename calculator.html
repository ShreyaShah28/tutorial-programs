<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Simple Calculator</title>
</head>
<body class="m-0 flex justify-center items-center h-screen bg-slate-200">
    <div class="font-sans bg-slate-950 rounded-2xl max-w-fit overflow-hidden" id="calculator">
        <input readonly id="display" class="w-full p-5 text-7xl text-left border-none bg-slate-700">
        <div id="keys" class="grid grid-cols-4 gap-3 p-6"></div>
    </div>
</body>
</html>
<script>
    const specialBtnClass='bg-orange-600 hover:bg-orange-500 active:bg-orange-400'
    const defaultClass='bg-slate-700 hover:bg-slate-600 active:bg-slate-500';
    const buttons=[{label:'+', value:'+', class:specialBtnClass},
                    {label:'7', value:'7',class:defaultClass},
                    {label:'6', value:'6',class:defaultClass},
                    {label:'5', value:'5',class:defaultClass},
                    {label:'-', value:'-', class:specialBtnClass},
                    {label:'4', value:'4',class:defaultClass},
                    {label:'5', value:'5',class:defaultClass},
                    {label:'6', value:'6',class:defaultClass},
                    {label:'*', value:'*', class:specialBtnClass},
                    {label:'1', value:'1',class:defaultClass},
                    {label:'2', value:'2',class:defaultClass},
                    {label:'3', value:'3',class:defaultClass},
                    {label:'/', value:'/', class:specialBtnClass},
                    {label:'0', value:'0',class:defaultClass},
                    {label:'.', value:'.',class:defaultClass},
                    {label:'=', action:'calculate',class:defaultClass},
                    {label:'C', action:'clear', class:specialBtnClass}
    ];

    const keys = document.getElementById("keys");
    const display = document.getElementById("display");
    buttons.forEach(btn => {
        const button = document.createElement("button");
        button.innerText=btn.label;
        button.className=`w-24 h-24 rounded-full border-none text-white text-5xl font-bold cursor-pointer ${btn.class}`;
        
        button.addEventListener("click",()=>{
            if(btn.action==='calculate'){
                calculate();
            }else if(btn.action==='clear'){
                clear();
            }else{
                appendToDisplay(btn.value);
            }
        });
        keys.appendChild(button);
    });

    function appendToDisplay(value){
        display.value+=value;
    }

    function calculate(){
        try{
            display.value = eval(display.value);
        }
        catch{
            display.value="ERROR";
        }
    }

    function clear(){
        display.value="";
    }
</script>
