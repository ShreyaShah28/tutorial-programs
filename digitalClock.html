<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 bg-[url(./images/indian-city-bg-img.avif)] bg-center bg-no-repeat bg-cover bg-fixed">
    <div id="clock-container" class="flex justify-center items-center h-screen">
        <div id="clock" class="font-mono text-8xl font-bold text-center text-white backdrop-blur-sm w-full bg-[hsla(0, 0%, 100%, 0.1)]" >00:00:00</div>
    </div>
</body>
</html>
<script>
    function updateClock(){
        const now= new Date();
        let hours=now.getHours();
        const meridiem = hours>=12?"PM":"AM";
        hours=hours%12||12;
        hours=hours.toString().padStart(2,0);
        const minutes=now.getMinutes().toString().padStart(2,0);
        const seconds=now.getSeconds().toString().padStart(2,0);
        const timeString=`${hours}:${minutes}:${seconds} ${meridiem}`;
        document.getElementById("clock").textContent=timeString;
    }

    updateClock();
    setInterval(updateClock,1000);
</script>
