<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="log-in-page-main-div">
        <div class="log-in-sub-div">
            <div class="sub-sub-div">
            <img src="./images/bootstrap-solid.svg" height="75px" width="75px">
            <p class="sign-in-text">Please sign in</p>
            <input type="email" class="input-fields" placeholder="Email Address" style="border-bottom: 1px solid rgb(188, 187, 187);">
            <input type="password" class="input-fields" placeholder="Password">
            <span class="remember-me-box" style="margin: 15px;">
                <input type="checkbox" value="Remember me"><span class="remember-me-text">Remember me</span>
            </span>
            <button class="button-style">Sign in</button>
            <p style="color: rgb(130, 129, 129);margin: 40px;">&copy;2017-2018</p>
            </div>
        </div>
    </div>
</body>
</html>
<style>
    .sign-in-text{
        font-size: 25px;
    }
    .remember-me-text{
        font-weight: 300;
    }
    .button-style{
        background-color: rgba(25, 116, 234, 0.899);
        color: white;
        margin: 10px;
        padding: 15px;
        border-style: none;
        width: 300px;
        font-size: 20px;
        border-radius: 4px;
    }
    .input-fields{
        padding: 15px;
        border-style: none;
        width: 270px;
        border-radius: 2px;
        font-size: 1em;
        box-shadow: 0px 0px 0px 1px rgba(206, 206, 206, 0.75);
    }
    .log-in-page-main-div{
        font-family: sans-serif;
        background-color: whitesmoke;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .log-in-sub-div{
        width: 40vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-content: center;
    }
    .sub-sub-div{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    
</style>
