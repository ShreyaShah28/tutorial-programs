<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Dice</title>
    <script src="index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container" class="font-sans text-center text-5xl font-bold">
        <h1>Dice Roller</h1>
        <label># of Dice:</label>
        <input type="number" min="1" value="1" id="numOfDice" class="text-[32px] h-9 w-36 text-center font-bold"/>
        <button onclick="roll()" class="text-2xl py-3 px-4 rounded-lg border-none bg-blue-700 hover:bg-blue-500 active:bg-blue-400 text-white font-bold cursor-pointer">Roll Dice</button>
        <div id="diceResult" class="m-4"></div>
        <div id="diceImages" class="flex flex-row items-center justify-center gap-5"></div>
    </div>
</body>
</html>
